<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TechnoShop - Online Store</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo">🛒 TechnoIndiaShop</div>

      <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#about">About</a>
        <a href="#about">Checkout</a>
      </nav>

      <button class="cart-button" onclick="openCart()">
        🛒 Cart <span id="cart-count">0</span>
      </button>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
      <div class="hero-content">
        <h1>Welcome to TechnoShop</h1>

        <p>Discover amazing products at great prices.</p>

        <button onclick="scrollToProducts()">Shop Now</button>
      </div>
    </section>

    <!-- Products Section -->
    <section id="products" class="products-section">
      <h2>Our Products</h2>

      <!-- Search -->
      <div class="search-container">
        <input
          type="text"
          id="search"
          placeholder="Search products..."
          onkeyup="searchProducts()" />
      </div>

      <!-- Categories -->
      <div class="categories">
        <button onclick="filterProducts('all')">All</button>

        <button onclick="filterProducts('electronics')">Electronics</button>

        <button onclick="filterProducts('clothing')">Clothing</button>

        <button onclick="filterProducts('shoes')">Shoes</button>
      </div>

      <!-- Product Grid -->
      <div id="product-container" class="product-grid"></div>
    </section>

    <!-- About -->
    <section id="about" class="about">
      <h2>About TechnoShop</h2>

      <p>
        TechnoShop is a demo online shopping website built using HTML, CSS and
        JavaScript.
      </p>
    </section>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal">
      <div class="cart-box">
        <span class="close" onclick="closeCart()"> &times; </span>

        <h2>Your Shopping Cart</h2>

        <div id="cart-items"></div>

        <div class="cart-total">Total: ₹<span id="cart-total">0</span></div>

        <button class="checkout-button" onclick="checkout()">Checkout</button>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <p>© 2026 TechnoShop | Demo Website</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
